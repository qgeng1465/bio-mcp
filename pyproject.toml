[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-mcp"
version = "0.2.0"
description = "BioMCP — 生物信息学 MCP 服务器：覆盖 13 个公开学术数据库，让任意 AI 助手检索 PubMed、BLAST、PDB、UniProt、Ensembl、STRING、InterPro、PubChem、KEGG、变异注释与跨库交叉验证。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "bioinformatics", "pubmed", "ncbi", "blast", "pdb", "uniprot", "ensembl", "string-db", "kegg", "gwas", "interpro", "pubchem"]
authors = [{ name = "qgeng1465" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/qgeng1465/bio-mcp"
Repository = "https://github.com/qgeng1465/bio-mcp"
Documentation = "https://github.com/qgeng1465/bio-mcp#readme"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
bio-mcp = "bio_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bio_mcp = ["py.typed"]
