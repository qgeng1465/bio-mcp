[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-mcp"
version = "0.1.0"
description = "BioMCP — 生物信息学 MCP 服务器：让任意 AI 助手直接检索 PubMed、下载 NCBI 序列、BLAST 比对、查询 PDB 结构、做 GO/KEGG 富集。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "bioinformatics", "pubmed", "ncbi", "blast", "pdb", "uniprot", "gene-ontology"]
authors = [{ name = "qgeng1465" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
bio-mcp = "bio_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bio_mcp = ["py.typed"]
